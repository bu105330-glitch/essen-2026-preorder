  .user-row input{width:130px}.user-btn{cursor:pointer}.user-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}.user-btn:disabled{opacity:.5;cursor:not-allowed}.user-btn.accent{background:var(--accent);border-color:var(--accent);color:white}.user-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}.user-count{font-size:12px;color:var(--soft)}
  .stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.stat{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--soft)}.stat b{color:var(--ink)}.stat.pickup b{color:var(--pickup)}
  .controls{position:sticky;top:0;z-index:20;display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding-top:12px;padding-bottom:14px;background:rgba(245,244,240,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

</style>

</div>

const SITE_META = {"updated":"2026/08/25","preview_count":961,"geeklist_entries":49};

const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const boothSortKey = booth => {
  if (!booth) return [99,'ZZZ',9999];
  const m = String(booth).match(/(?:H\s*)?(\d+)\s*[- ]?\s*([A-Z])?\s*(\d+)?/i);
  return m ? [Number(m[1]),(m[2]||'').toUpperCase(),Number(m[3]||0)] : [98,String(booth),0];
};
const compareBooth = (a,b) => { const x=boothSortKey(a),y=boothSortKey(b); return x[0]-y[0] || x[1].localeCompare(y[1]) || x[2]-y[2]; };
const hallsFor = booth => { const m=String(booth||'').match(/(?:^|\s|\/)(?:H\s*)?(\d+)/i); return m ? [m[1]] : []; };
const ROWS = DATA.flatMap(group => (group.games||[]).map(g => ({...g,publisher:g.publisher||group.publisher,booth:g.booth||group.booth||'',halls:hallsFor(g.booth||group.booth)})));

function fillSelect(id, values, label) {
  const el=document.getElementById(id);
  values.forEach(value=>{const o=document.createElement('option');o.value=value;o.textContent=label?label(value):value;el.appendChild(o)});
}
fillSelect('hallFilter',[...new Set(ROWS.flatMap(r=>r.halls))].sort((a,b)=>Number(a)-Number(b)),h=>`Hall ${h}`);
fillSelect('categoryFilter',[...new Set(ROWS.flatMap(r=>r.categories||[]))].sort((a,b)=>a.localeCompare(b)));

const previewCount=ROWS.filter(r=>r.in_preview).length;
const pickupCount=ROWS.filter(r=>r.pickup).length;
const boothCount=new Set(ROWS.map(r=>r.booth).filter(Boolean)).size;
document.getElementById('stats').innerHTML=`<div class="stat"><b>${previewCount}</b> 款 BGG 展會項目</div><div class="stat"><b>${ROWS.length}</b> 款合併後清單</div><div class="stat"><b>${boothCount}</b> 個已公告攤位</div><div class="stat pickup"><b>${pickupCount}</b> 款 Pickup / Pre-order</div>`;
document.getElementById('updated').textContent=SITE_META.updated||'';

const USER_STORE_KEY='essen2026_userlists_v1';
function loadStore(){try{const x=JSON.parse(localStorage.getItem(USER_STORE_KEY)||'{}');return {currentUser:typeof x.currentUser==='string'?x.currentUser:'',users:x.users&&typeof x.users==='object'?x.users:{}}}catch{return {currentUser:'',users:{}}}}
function saveStore(){try{localStorage.setItem(USER_STORE_KEY,JSON.stringify(userStore))}catch{}}
let userStore=loadStore(),showOnlyMyList=false,currentView='booth';
const gameKey=r=>r.preview_url||r.bgg_url||`${r.publisher}::${r.name}`;
const currentList=()=>userStore.currentUser&&userStore.users[userStore.currentUser]?userStore.users[userStore.currentUser]:[];
const inMyList=key=>currentList().includes(key);
function toggleList(key){if(!userStore.currentUser)return;const list=userStore.users[userStore.currentUser]||(userStore.users[userStore.currentUser]=[]);const i=list.indexOf(key);i>=0?list.splice(i,1):list.push(key);saveStore()}
function renderUser(){const select=document.getElementById('userSelect');const names=Object.keys(userStore.users).sort((a,b)=>a.localeCompare(b));select.innerHTML='<option value="">選擇使用者</option>'+names.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');select.value=userStore.currentUser||'';const count=currentList().length;document.getElementById('userCount').textContent=userStore.currentUser?`${userStore.currentUser}：${count} 款`:'尚未選擇使用者';document.getElementById('toggleMyListBtn').disabled=!userStore.currentUser;document.getElementById('toggleMyListBtn').classList.toggle('active',showOnlyMyList);document.getElementById('exportExcelBtn').disabled=!userStore.currentUser||!count}

function formatPrice(r){if(r.price_eur!=null)return `€${r.price_eur}`;if(r.show_price!=null)return `${r.show_price_currency||''} ${r.show_price}`.trim();return ''}
function playerText(r){if(!r.min_players&&!r.max_players)return '人數未公告';if(r.min_players===r.max_players)return `${r.min_players} 人`;return `${r.min_players||'?'}–${r.max_players||'?'} 人`}
function cardHtml(r){
  const key=gameKey(r),selected=inMyList(key),price=formatPrice(r);
  const image=r.image?`<div class="image"><img src="${escapeHtml(r.image)}" alt="${escapeHtml(r.name)}" loading="lazy"></div>`:'<div class="image">尚無圖片</div>';
  const title=r.bgg_url?`<a class="title" href="${escapeHtml(r.bgg_url)}" target="_blank" rel="noopener">${escapeHtml(r.name)}</a>`:`<span class="title">${escapeHtml(r.name)}</span>`;
  const cats=(r.categories||[]).slice(0,3).map(c=>`<span class="cat">${escapeHtml(c)}</span>`).join('');
  const actions=[r.preorder_url?`<a class="action preorder" href="${escapeHtml(r.preorder_url)}" target="_blank" rel="noopener">Pre-order 連結</a>`:'',r.geeklist_url?`<a class="action" href="${escapeHtml(r.geeklist_url)}" target="_blank" rel="noopener">Pickup 資料</a>`:'',r.preview_url?`<a class="action" href="${escapeHtml(r.preview_url)}" target="_blank" rel="noopener">展會資料</a>`:''].filter(Boolean).join('');
  const facts=`<div class="facts"><span class="fact">${playerText(r)}</span><span class="fact">${r.min_age?`${r.min_age}+ 歲`:'年齡未公告'}</span><span class="fact weight">BGG 重度 ${r.bgg_weight!=null?`${Number(r.bgg_weight).toFixed(2)} / 5`:'未評分'}</span></div>`;
  return `<article class="card ${r.pickup?'pickup':''}">${r.pickup?'<span class="pickup-badge">PICKUP / PRE-ORDER</span>':''}${userStore.currentUser?`<button class="list-btn ${selected?'active':''}" data-key="${escapeHtml(key)}" title="加入或移出我的清單">${selected?'✓':'＋'}</button>`:''}${image}<div class="body">${title}<div class="meta">${r.year?`<span class="year">${r.year}</span>`:''}${r.availability?`<span class="availability">${escapeHtml(r.availability)}</span>`:''}${price?`<span class="price">${escapeHtml(price)}</span>`:''}</div>${facts}${cats?`<div class="cats">${cats}</div>`:''}${(r.designers||[]).length?`<div class="designer">設計師：${escapeHtml(r.designers.join('、'))}</div>`:''}${actions?`<div class="actions">${actions}</div>`:''}<div class="footerline">${escapeHtml(r.publisher)}<br>${r.booth?`攤位 ${escapeHtml(r.booth)}`:'攤位未公告'}</div></div></article>`;
}

function filteredRows(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase(),pickup=document.getElementById('pickupFilter').value,hall=document.getElementById('hallFilter').value,cat=document.getElementById('categoryFilter').value,player=document.getElementById('playerFilter').value,age=document.getElementById('ageFilter').value,weight=document.getElementById('weightFilter').value;
  let rows=ROWS.filter(r=>{if(pickup==='pickup'&&!r.pickup)return false;if(pickup==='show'&&r.pickup)return false;if(hall&&!r.halls.includes(hall))return false;if(cat&&!(r.categories||[]).includes(cat))return false;if(player){if(!r.min_players||!r.max_players)return false;if(player==='9plus'){if(r.max_players<9)return false}else{const n=Number(player);if(r.min_players>n||r.max_players<n)return false}}if(age&&(!r.min_age||r.min_age>Number(age)))return false;if(weight){const w=Number(r.bgg_weight);if(weight==='unrated'&&r.bgg_weight!=null)return false;if(weight!=='unrated'&&r.bgg_weight==null)return false;if(weight==='light'&&w>=2)return false;if(weight==='medium'&&(w<2||w>=3))return false;if(weight==='heavy'&&(w<3||w>=4))return false;if(weight==='veryheavy'&&w<4)return false}if(showOnlyMyList&&!inMyList(gameKey(r)))return false;if(q&&!`${r.name} ${r.publisher} ${r.booth} ${(r.designers||[]).join(' ')}`.toLowerCase().includes(q))return false;return true});
  const sort=document.getElementById('sortSelect').value;
  rows.sort((a,b)=>sort==='booth'?compareBooth(a.booth,b.booth)||a.publisher.localeCompare(b.publisher)||a.name.localeCompare(b.name):sort==='publisher'?a.publisher.localeCompare(b.publisher)||a.name.localeCompare(b.name):sort==='name'?a.name.localeCompare(b.name):(b.year||0)-(a.year||0));return rows;
}
function render(){
  const rows=filteredRows();document.getElementById('resultCount').textContent=`顯示 ${rows.length} / ${ROWS.length} 款`;
  const filterIds=['pickupFilter','hallFilter','categoryFilter','playerFilter','ageFilter','weightFilter'];const activeCount=filterIds.filter(id=>document.getElementById(id).value).length;const toggle=document.getElementById('filterToggle');toggle.textContent=activeCount?`篩選條件（${activeCount}）`:'篩選條件';toggle.classList.toggle('active',activeCount>0);
  if(!rows.length){document.getElementById('main').innerHTML='<div class="empty">沒有符合條件的遊戲，請調整篩選條件。</div>';return}
  if(currentView==='flat'){document.getElementById('main').innerHTML=`<div class="grid">${rows.map(cardHtml).join('')}</div>`;return}
  const groups=new Map();rows.forEach(r=>{const key=r.booth||'攤位未公告';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)});
  const keys=[...groups.keys()].sort((a,b)=>a==='攤位未公告'?1:b==='攤位未公告'?-1:compareBooth(a,b));
  document.getElementById('main').innerHTML=keys.map(key=>`<section class="group"><div class="group-head"><h2>${key==='攤位未公告'?key:`攤位 ${escapeHtml(key)}`}</h2><span class="count-tag">${groups.get(key).length} 款</span></div><div class="grid">${groups.get(key).map(cardHtml).join('')}</div></section>`).join('');
}
function exportExcel(){const keys=new Set(currentList());const rows=ROWS.filter(r=>keys.has(gameKey(r))).map(r=>({'攤位':r.booth||'','出版商':r.publisher,'遊戲':r.name,'年份':r.year||'','Pickup / Pre-order':r.pickup?'是':'否','價格':formatPrice(r),'設計師':(r.designers||[]).join('、'),'類型':(r.categories||[]).join('、'),'Pre-order 連結':r.preorder_url||'','BGG 連結':r.bgg_url||''}));if(typeof XLSX==='undefined'){alert('Excel 元件尚未載入，請重新整理後再試。');return}const ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=[{wch:13},{wch:20},{wch:32},{wch:7},{wch:18},{wch:12},{wch:24},{wch:28},{wch:45},{wch:45}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'我的清單');XLSX.writeFile(wb,`essen2026_${userStore.currentUser}_清單.xlsx`)}

['searchInput','pickupFilter','hallFilter','categoryFilter','playerFilter','ageFilter','weightFilter','sortSelect'].forEach(id=>document.getElementById(id).addEventListener(id==='searchInput'?'input':'change',render));
document.getElementById('filterToggle').onclick=()=>{const panel=document.getElementById('filterPanel'),open=panel.hidden;panel.hidden=!open;document.getElementById('filterToggle').setAttribute('aria-expanded',String(open))};
document.getElementById('resetFilters').onclick=()=>{['pickupFilter','hallFilter','categoryFilter','playerFilter','ageFilter','weightFilter'].forEach(id=>document.getElementById(id).value='');render()};
document.getElementById('viewBooth').onclick=()=>{currentView='booth';document.getElementById('viewBooth').classList.add('active');document.getElementById('viewFlat').classList.remove('active');render()};
document.getElementById('viewFlat').onclick=()=>{currentView='flat';document.getElementById('viewFlat').classList.add('active');document.getElementById('viewBooth').classList.remove('active');render()};
document.getElementById('newUserBtn').onclick=()=>{const el=document.getElementById('newUserInput'),name=el.value.trim();if(!name)return;if(!userStore.users[name])userStore.users[name]=[];userStore.currentUser=name;el.value='';saveStore();renderUser();render()};
document.getElementById('newUserInput').onkeydown=e=>{if(e.key==='Enter')document.getElementById('newUserBtn').click()};
document.getElementById('userSelect').onchange=e=>{userStore.currentUser=e.target.value;saveStore();renderUser();render()};
document.getElementById('toggleMyListBtn').onclick=()=>{showOnlyMyList=!showOnlyMyList;renderUser();render()};
document.getElementById('exportExcelBtn').onclick=exportExcel;
document.getElementById('main').onclick=e=>{const btn=e.target.closest('.list-btn');if(!btn)return;toggleList(btn.dataset.key);renderUser();render()};
renderUser();render();
</script>
</body>
