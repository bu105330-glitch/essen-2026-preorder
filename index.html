<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essen 2026 Preorder Board Game List</title>

  <style>

    table {
      width: 100%;

    td {

      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #222;
      color: white;
    }

    tr:hover {
      background: #f2f2f2;
    }

</head>

</body>
</html>
